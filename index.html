<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4effa">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="追剧日记">
<title>追剧日记</title>
<style>
 :root{--purple:#8655c7;--purple2:#a77be0;--lav:#f0e6fb;--bg:#fbf7ff;--ink:#352744;--muted:#968aa5;--peach:#e69b80;--green:#69a78a;--line:#eadff4}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 10% 0%,#f0e4ff 0,transparent 42%),linear-gradient(160deg,#fcf8ff,#f8f1ff 55%,#fff8fb);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
header{padding:calc(18px + env(safe-area-inset-top)) 18px 15px;display:flex;justify-content:space-between;align-items:center;max-width:760px;margin:auto}h1{font-size:29px;margin:0 0 5px;font-weight:850;letter-spacing:.5px;color:#4b315f}.sub{font-size:12px;color:#9b8baa}.logo{width:54px;height:54px;border-radius:19px;background:linear-gradient(145deg,#eadbff,#fff0f7);display:grid;place-items:center;font-size:29px;box-shadow:0 5px 18px #8a5db51c}
main{padding:0 14px;max-width:760px;margin:auto}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:12px}.tile,.card,.panel{background:#ffffffed;border:1px solid #f0e7f6;border-radius:20px;padding:14px;box-shadow:0 5px 18px #62417b0b}.tile small,.muted{color:var(--muted);font-size:12px}.num{font-size:26px;font-weight:850;color:var(--purple);margin-top:6px}
.remaining{background:linear-gradient(115deg,#eee2ff,#f8eafa);border:1px solid #e8d9f7;border-radius:20px;padding:16px;margin-bottom:18px;display:flex;justify-content:space-between;align-items:center}.remaining strong{font-size:25px;color:var(--purple)}.remaining small{display:block;color:#82758f;margin-top:4px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.section-title{font-size:18px;font-weight:800;margin:18px 0 12px;color:#4d3b5b}
button{border:1px solid #eadff4;border-radius:13px;padding:10px 13px;background:#f5effb;color:#7652a5;font-weight:700;font-size:13px;cursor:pointer;touch-action:manipulation}button.primary{background:linear-gradient(135deg,#a77be0,#8754c6);border-color:transparent;color:white;box-shadow:0 4px 10px #9568c42b}button.ghost{background:#f7f3fa;color:#8d8198}button.danger{background:#fff0ef;color:#b85e4c;border-color:#f8dfdc}button:disabled{opacity:.4}
.filters{display:flex;gap:7px;overflow:auto;padding:2px 0 12px;scrollbar-width:none}.filters::-webkit-scrollbar{display:none}.filters button{white-space:nowrap;background:#fff;border-color:#eadff4}.filters button.active{background:linear-gradient(135deg,#a77be0,#8754c6);color:white;border-color:transparent;box-shadow:0 4px 12px #9568c42b}
.drama{padding:14px;margin-bottom:12px}.poster{width:58px;height:76px;border-radius:13px;background:linear-gradient(145deg,#efe5fa,#fff1f7);display:grid;place-items:center;color:var(--purple);font-size:24px;flex-shrink:0;overflow:hidden}.poster img{width:100%;height:100%;object-fit:cover;display:block}.search-row{display:flex;gap:8px;align-items:center}.search-row input{flex:1;min-width:0}.search-row button{margin-top:6px;white-space:nowrap}.match-results{display:grid;gap:8px;margin-top:10px}.match-item{display:flex;gap:10px;align-items:center;text-align:left;background:white;border:1px solid var(--line);border-radius:12px;padding:9px;width:100%;color:var(--ink)}.match-item img{width:42px;height:58px;object-fit:cover;border-radius:7px;background:var(--lav)}.match-item small{display:block;color:var(--muted);font-weight:400;margin-top:4px}
.drama-title{font-weight:800;font-size:16px;overflow-wrap:anywhere}.tag{font-size:11px;background:#f0e6fb;color:var(--purple);padding:5px 9px;border-radius:20px;white-space:nowrap}.sort-controls{display:flex;gap:4px;align-items:center;flex-shrink:0}.sort-controls button{padding:6px 9px;font-size:13px;min-width:30px}.sort-controls button:disabled{opacity:.3}.bar{height:8px;background:#f0eaf5;border-radius:10px;overflow:hidden;margin:8px 0 12px}.bar span{height:100%;display:block;background:linear-gradient(90deg,#c19be9,#8754c6);border-radius:10px}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-bottom:12px}.metrics div{background:#faf7fc;border:1px solid #f2ebf7;border-radius:12px;padding:8px;text-align:center}.metrics b{display:block;font-size:17px}.metrics small{font-size:10px;color:var(--muted)}.actions{display:flex;justify-content:space-between;align-items:center;gap:8px}.actions .left{display:flex;gap:6px}
.bottom{position:fixed;bottom:0;left:0;right:0;padding:9px 14px calc(9px + env(safe-area-inset-bottom));background:#ffffffed;backdrop-filter:blur(16px);display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid #eee5f4;z-index:5}.bottom button{background:transparent;border-color:transparent;color:var(--muted);font-size:12px;padding:8px}.bottom button.active{color:var(--purple);background:#f0e6fb}.view{display:none}.view.active{display:block}.empty{text-align:center;padding:32px 18px;color:var(--muted)}.empty .emoji{font-size:38px;margin-bottom:10px}
input,select,textarea{width:100%;padding:12px;border:1px solid #e8dff0;border-radius:13px;background:#fff;font:inherit;color:var(--ink);margin-top:6px;min-height:44px}label{display:block;font-size:12px;color:#857891;margin:12px 0 3px}.modal{position:fixed;inset:0;background:#24183277;display:none;align-items:flex-end;z-index:10}.modal.show{display:flex}.sheet{background:linear-gradient(160deg,#fffaff,#f9f4ff);border:1px solid #eee3f7;border-radius:24px 24px 0 0;width:100%;max-height:92vh;overflow:auto;padding:19px 18px calc(25px + env(safe-area-inset-bottom));box-shadow:0 -8px 30px #35204720}.sheet h2{margin:0 0 12px;color:#4b315f}.form-actions{display:flex;gap:10px;margin-top:16px}.form-actions button{flex:1}.datebox{margin-bottom:14px}.record{display:flex;justify-content:space-between;padding:13px;background:#faf7fc;border-radius:12px;margin:8px 0}.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.statbox{padding:16px;background:white;border:1px solid #f0e7f6;border-radius:18px}.statbox b{font-size:28px;color:var(--purple);display:block;margin-top:7px}.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}footer{text-align:center;color:#aaa2b0;font-size:11px;padding:22px}
@media(max-width:380px){h1{font-size:25px}.stats{gap:6px}.tile{padding:11px 9px}.num{font-size:23px}.actions button{padding:9px 10px}.sheet{padding-left:14px;padding-right:14px}}
</style>
</head>
<body>
<header><div><h1>追剧日记</h1><div class="sub">记录每一部喜欢的剧 ♡ · <span id="todayLabel"></span></div></div><div class="logo">🎬</div></header>
<main>
<section id="home" class="view active">
 <div class="stats">
  <div class="tile"><small>我的剧集</small><div class="num" id="count">0</div><small>部电视剧</small></div>
  <div class="tile"><small>累计已看</small><div class="num" id="watched">0</div><small>集</small></div>
  <div class="tile"><small>今日已看</small><div class="num" id="today">0</div><small>集</small></div>
 </div>
 <div class="remaining"><div><b>待追总集数</b><small>所有电视剧剩余集数合计</small></div><strong id="remaining">0 集</strong></div>
 <div class="row"><div class="section-title" style="margin:0">我的片单</div><button class="primary" onclick="openForm()">＋ 添加电视剧</button></div>
 <div class="filters" id="filters"></div>
 <div id="dramas"></div>
</section>
<section id="diary" class="view">
 <div class="section-title">追剧日历</div>
 <div class="panel datebox"><label for="diaryDate">选择日期</label><input type="date" id="diaryDate" onchange="renderDiary()"></div>
 <div class="row"><b id="diaryTitle"></b><b id="diaryTotal" style="color:var(--purple)"></b></div>
 <div id="records"></div>
</section>
<section id="stats" class="view">
 <div class="section-title">追剧数据</div>
 <div class="statgrid">
  <div class="statbox"><small class="muted">今日观看</small><b id="sToday">0</b><small class="muted">集</small></div>
  <div class="statbox"><small class="muted">本周观看</small><b id="sWeek">0</b><small class="muted">集</small></div>
  <div class="statbox"><small class="muted">累计观看</small><b id="sAll">0</b><small class="muted">集</small></div>
  <div class="statbox"><small class="muted">待追总数</small><b id="sRemain">0</b><small class="muted">集</small></div>
 </div>
 <div class="section-title">各剧观看进度</div><div id="progressList"></div>
 <div class="section-title">数据备份</div>
 <div class="panel"><div class="muted">建议定期导出备份，换手机或清理浏览器数据前可用于恢复。</div><div class="tools"><button class="primary" onclick="exportData()">导出备份</button><button onclick="document.getElementById('importFile').click()">导入备份</button><input id="importFile" type="file" accept="application/json" hidden onchange="importData(event)"></div></div>
</section>
<footer>追剧日记 · 把每一集精彩都记录下来</footer>
</main>
<nav class="bottom"><button class="active" data-tab="home" onclick="tab('home',this)">▣ 剧集</button><button data-tab="diary" onclick="tab('diary',this)">▦ 日历</button><button data-tab="stats" onclick="tab('stats',this)">▤ 统计</button></nav>
<div class="modal" id="modal" onclick="if(event.target===this)closeForm()"><div class="sheet">
 <h2 id="formTitle">添加电视剧</h2><input id="editId" type="hidden">
 <label>电视剧名称</label><div class="search-row"><input id="fTitle" placeholder="例如：长相思"><button type="button" onclick="searchEpisodeCount()">网络查集数</button></div><div id="matchResults" class="match-results"></div><div class="muted" style="margin-top:6px">根据百度网页搜索结果识别可能的总集数；如有多个版本，可在下拉列表中选择。</div>
 <div class="row"><div style="flex:1"><label>总集数</label><input id="fTotal" type="number" min="1" value="24"></div><div style="flex:1"><label>已观看集数</label><input id="fWatched" type="number" min="0" value="0"></div></div>
 <div class="row"><div style="flex:1"><label>目前已更新至</label><input id="fAired" type="number" min="0" value="0"></div><div style="flex:1"><label>剧集状态</label><select id="fStatus"><option>更新中</option><option>已完结</option><option>待开播</option></select></div></div>
 <div class="row"><div style="flex:1"><label>更新平台</label><select id="fPlatform"><option>优酷</option><option>腾讯视频</option><option>爱奇艺</option><option>bilibili</option><option>其他</option></select></div><div style="flex:1"><label>剧集类型</label><select id="fRegion"><option>国产剧</option><option>海外剧</option></select></div></div>
 <label>开播日期（选填）</label><input id="fDate" type="date">
 <input id="fPoster" type="hidden"><input id="fDouban" type="hidden">
 <label>备注（选填）</label><textarea id="fNotes" rows="2" placeholder="记录一点追剧感想…"></textarea>
 <div class="form-actions"><button class="ghost" onclick="closeForm()">取消</button><button class="primary" onclick="saveDrama()">保存</button></div>
</div></div>
<script>
const KEY='drama-diary-web-v1';
let data={dramas:[],records:[]},filter='全部',currentTab='home';
const $=id=>document.getElementById(id);
const todayKey=()=>new Date().toLocaleDateString('sv-SE');
const dayKey=d=>new Date(d).toLocaleDateString('sv-SE');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function load(){try{data=JSON.parse(localStorage.getItem(KEY))||data}catch(e){};if(!Array.isArray(data.dramas))data.dramas=[];if(!Array.isArray(data.records))data.records=[]}
function save(){localStorage.setItem(KEY,JSON.stringify(data));render()}
function tab(name,el){currentTab=name;document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id===name));document.querySelectorAll('.bottom button').forEach(b=>b.classList.toggle('active',b.dataset.tab===name));if(name==='diary')renderDiary();if(name==='stats')renderStats()}
function addRecord(drama,n,date=todayKey()){let r=data.records.find(x=>x.dramaId===drama.id&&x.date===date);if(r)r.episodes+=n;else data.records.push({id:crypto.randomUUID(),dramaId:drama.id,title:drama.title,date,episodes:n})}
function watched(drama,delta){let old=drama.watched;drama.watched=Math.max(0,Math.min(drama.total,drama.watched+delta));let actual=drama.watched-old;if(actual>0)addRecord(drama,actual);if(actual<0){let n=-actual;data.records.filter(r=>r.dramaId===drama.id).sort((a,b)=>b.date.localeCompare(a.date)).forEach(r=>{let x=Math.min(n,r.episodes);r.episodes-=x;n-=x});data.records=data.records.filter(r=>r.episodes>0)}if(old<drama.total&&drama.watched>=drama.total)filter='已追剧完成';else if(old>=drama.total&&drama.watched<drama.total)filter='全部';save()}
function render(){let ds=data.dramas;let archived=ds.filter(d=>Number(d.watched)>=Number(d.total)&&Number(d.total)>0);let active=ds.filter(d=>!(Number(d.watched)>=Number(d.total)&&Number(d.total)>0));let all=ds.reduce((a,d)=>a+d.watched,0),remain=active.reduce((a,d)=>a+Math.max(0,d.total-d.watched),0),tod=data.records.filter(r=>r.date===todayKey()).reduce((a,r)=>a+r.episodes,0);$('count').textContent=ds.length;$('watched').textContent=all;$('today').textContent=tod;$('remaining').textContent=remain+' 集';
$('filters').innerHTML=['全部','更新中','已完结','待开播','已追剧完成'].map(x=>`<button class="${filter===x?'active':''}" onclick="filter='${x}';render()">${x}${x==='已追剧完成'?' '+archived.length:''}</button>`).join('');
let list=filter==='已追剧完成'?archived:active.filter(d=>filter==='全部'||d.status===filter);$('dramas').innerHTML=list.length?list.map((d,i)=>{let isArchived=Number(d.watched)>=Number(d.total)&&Number(d.total)>0;return `<article class="card drama"><div class="row" style="align-items:flex-start"><div class="row" style="justify-content:flex-start;min-width:0"><div class="poster">${d.poster?`<img src="${esc(d.poster)}" referrerpolicy="no-referrer" onerror="this.remove();this.parentNode.textContent='▶'">`:'▶'}</div><div style="min-width:0"><div class="drama-title">${esc(d.title)}</div><div class="muted" style="margin-top:5px">${d.status==='待开播'?'等待开播':`目前更新至第 ${d.aired} 集`} · 共 ${d.total} 集</div><div class="muted" style="margin-top:5px">${esc(d.platform||'其他')} · ${esc(d.region||'国产剧')}</div></div></div><div style="display:flex;flex-direction:column;align-items:flex-end;gap:7px"><span class="tag">${isArchived?'已追剧完成':esc(d.status)}</span><div class="sort-controls">${!isArchived?`<button aria-label="上移" onclick="reorderDrama('${d.id}',-1)" ${i===0?'disabled':''}>↑</button><button aria-label="下移" onclick="reorderDrama('${d.id}',1)" ${i===list.length-1?'disabled':''}>↓</button>`:''}</div></div></div><div class="row muted" style="margin-top:14px"><span>观看进度</span><b style="color:var(--purple)">${Math.round(d.watched/d.total*100)}%</b></div><div class="bar"><span style="width:${d.watched/d.total*100}%"></span></div><div class="metrics"><div><b style="color:var(--purple)">${d.watched}</b><small>已观看</small></div><div><b style="color:var(--peach)">${Math.max(0,d.total-d.watched)}</b><small>待追集数</small></div><div><b style="color:var(--green)">${d.aired}</b><small>已更新</small></div></div><div class="actions"><div class="left"><button class="ghost" onclick="watched(data.dramas.find(x=>x.id==='${d.id}'),-1)">−</button><button class="primary" onclick="watched(data.dramas.find(x=>x.id==='${d.id}'),1)" ${d.watched>=d.total?'disabled':''}>${isArchived?'已全部看完':'＋ 看完一集'}</button></div><div class="left"><button onclick="editDrama('${d.id}')">编辑</button><button class="danger" onclick="deleteDrama('${d.id}')">删除</button></div></div></article>`}).join(''):`<div class="card empty"><div class="emoji">${filter==='已追剧完成'?'🏆':'🎬'}</div><b>${filter==='已追剧完成'?'还没有已追完的剧集':'片单还是空的'}</b><p>${filter==='已追剧完成'?'看完某部电视剧的全部集数后，它会自动归档到这里。':'添加第一部电视剧，开始记录追剧进度吧。'}</p>${filter==='已追剧完成'?'':'<button class="primary" onclick="openForm()">添加电视剧</button>'}</div>`;
if($('diaryDate')&&!$('diaryDate').value)$('diaryDate').value=todayKey();
}
function reorderDrama(id,direction){let visible=data.dramas.filter(d=>(filter==='全部'||d.status===filter)&&!(Number(d.watched)>=Number(d.total)&&Number(d.total)>0)),index=visible.findIndex(d=>d.id===id),target=visible[index+direction];if(!target)return;let a=data.dramas.findIndex(d=>d.id===id),b=data.dramas.findIndex(d=>d.id===target.id);[data.dramas[a],data.dramas[b]]=[data.dramas[b],data.dramas[a]];save()}
function openForm(){ $('formTitle').textContent='添加电视剧';$('editId').value='';$('fTitle').value='';$('fTotal').value=24;$('fWatched').value=0;$('fAired').value=0;$('fStatus').value='更新中';$('fPlatform').value='优酷';$('fRegion').value='国产剧';$('fDate').value='';$('fNotes').value='';$('fPoster').value='';$('fDouban').value='';$('matchResults').innerHTML='';$('modal').classList.add('show')}
function editDrama(id){let d=data.dramas.find(x=>x.id===id);if(!d)return;openForm();$('formTitle').textContent='编辑电视剧';$('editId').value=id;$('fTitle').value=d.title;$('fTotal').value=d.total;$('fWatched').value=d.watched;$('fAired').value=d.aired;$('fStatus').value=d.status;$('fPlatform').value=d.platform||'其他';$('fRegion').value=d.region||'国产剧';$('fDate').value=d.date||'';$('fNotes').value=d.notes||'';$('fPoster').value=d.poster||'';$('fDouban').value=d.doubanUrl||'';$('matchResults').innerHTML=''}
function closeForm(){$('modal').classList.remove('show')}
function extractEpisodeCandidates(text){
 let found=[]; const patterns=[/(?:全\s*)?(\d{1,3})\s*集\s*(?:全|完结|大结局)/g,/(?:共|总计|总共|全剧共)[^\d]{0,8}(\d{1,3})\s*集/g,/(\d{1,3})\s*集(?:电视剧|网剧|连续剧)/g,/(?:总集数|集数)\s*[:：为约]?\s*(\d{1,3})\s*集?/g];
 for(const re of patterns){let m;while((m=re.exec(text))!==null){let n=Number(m[1]);let before=text.slice(Math.max(0,m.index-28),m.index);let around=text.slice(m.index,Math.min(text.length,m.index+48));if(n>0&&n<300&&!/(更新至|已更新|播出至|目前更新|更至)\s*$/.test(before)&&!/(更新至|已更新|播出至)/.test(around))found.push({count:n,context:(before+around).replace(/\s+/g,' ').slice(-105)});}}
 const counts=new Map();for(const x of found){if(!counts.has(x.count))counts.set(x.count,x)}
 return [...counts.values()].slice(0,5)
}
async function searchEpisodeCount(){
 let q=$('fTitle').value.trim();if(!q){alert('请先填写电视剧名称');return}
 let box=$('matchResults');let btn=document.querySelector('.search-row button');
 if(btn){btn.disabled=true;btn.textContent='搜索中…'}
 box.innerHTML='<div class="muted">正在快速搜索，通常几秒内返回…</div>';
 const query='"'+q+'" 总集数 一共多少集 多少集全';
 const target='https://www.baidu.com/s?wd='+encodeURIComponent(query)+'&ie=utf-8&rn=8';
 const reader='https://r.jina.ai/http://'+target.replace(/^https?:\/\//,'');
 const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),9000);
 try{
  const response=await fetch(reader,{signal:controller.signal,headers:{'Accept':'text/plain','X-Engine':'direct','X-Respond-Timing':'visible-content','X-Timeout':'8','X-Token-Budget':'1500','X-Retain-Images':'none','X-Retain-Links':'none'}});
  if(!response.ok)throw new Error('搜索服务暂时不可用');
  const body=(await response.text()).slice(0,14000);const candidates=extractEpisodeCandidates(body);
  if(!candidates.length){box.innerHTML='<div class="muted">没有识别到明确的总集数，请直接手动填写总集数即可。也可以补充年份或播出平台后再试一次。</div>';return}
  box.innerHTML='<label style="margin:0 0 4px">请选择识别到的总集数</label><select id="episodeChoice"><option value="">请选择总集数</option>'+candidates.map(x=>'<option value="'+x.count+'">'+x.count+' 集 — '+esc(x.context)+'</option>').join('')+'</select><button type="button" class="primary" style="margin-top:8px" onclick="applyEpisodeChoice()">使用所选集数</button><div class="muted" style="margin-top:7px">结果来自百度搜索摘要，不同播出版本可能集数不同，请核对后选择。</div>';
 }catch(e){let msg=e.name==='AbortError'?'搜索超时，请直接手动填写总集数。':'搜索失败，可能是网络或服务限制，请直接手动填写总集数。';box.innerHTML='<div class="muted">'+msg+'</div>'}
 finally{clearTimeout(timer);if(btn){btn.disabled=false;btn.textContent='网络查集数'}}
}
function applyEpisodeChoice(){let n=Number($('episodeChoice')?.value);if(!n){alert('请先选择一个总集数');return}$('fTotal').value=n;if(Number($('fWatched').value)>n)$('fWatched').value=n;if(Number($('fAired').value)>n)$('fAired').value=n;$('matchResults').innerHTML='<div class="muted">已将总集数设置为 '+n+' 集。</div>'}
function parseEpisodeCount(item){let candidates=[item.episodes_info,item.episodes,item.episode_count,item.total_episodes,item.card_subtitle,item.title];for(let v of candidates){if(typeof v==='number'&&v>0)return v;if(typeof v==='string'){let m=v.match(/(\d{1,3})\s*(?:集|episodes?)/i);if(m)return Number(m[1]);}}return null}
function knownEpisodeCount(title){let t=String(title||'').replace(/[\s··:：()（）【】\[\]\-]/g,'');if(t.includes('嫁金钗'))return 30;return null}
function normalizeDoubanResults(json){let arr=Array.isArray(json)?json:(json?.data?.list||json?.data?.subjects||json?.data||json?.subjects||json?.results||[]);if(!Array.isArray(arr))return [];return arr.map(x=>{let pic=x.pic?.large||x.pic?.normal||x.cover_url||x.cover||x.poster||x.image||'';let title=x.title||x.name||x.subject?.title||'';let id=x.id||x.subject_id||x.subject?.id||'';let url=x.url||x.uri||(id?`https://movie.douban.com/subject/${id}/`:'');let known=knownEpisodeCount(title);return {title,poster:pic,episodes:known||parseEpisodeCount(x),url,year:x.year||((x.card_subtitle||'').match(/\b(19|20)\d{2}\b/)||[])[0]||'',info:known?('优酷版 · '+known+'集'):x.episodes_info||x.card_subtitle||''}}).filter(x=>x.title)}
async function searchDouban(){let q=$('fTitle').value.trim();if(!q){alert('请先填写电视剧名称');return}let box=$('matchResults');box.innerHTML='<div class="muted">正在搜索豆瓣条目…</div>';try{let url='https://haibaowang.top/api/api.php?search='+encodeURIComponent(q)+'&source='+encodeURIComponent('电视剧')+'&limit=8';let res=await fetch(url,{headers:{'Accept':'application/json'}});if(!res.ok)throw new Error('搜索服务暂时不可用');let json=await res.json();let items=normalizeDoubanResults(json);if(!items.length)throw new Error('没有找到匹配的电视剧，请尝试补充年份或更完整的剧名');box.innerHTML='';items.slice(0,8).forEach(item=>{let b=document.createElement('button');b.type='button';b.className='match-item';let img=document.createElement('img');img.src=item.poster||'';img.referrerPolicy='no-referrer';img.onerror=()=>{img.style.visibility='hidden'};let txt=document.createElement('span');txt.style.flex='1';let title=document.createElement('b');title.textContent=item.title;let meta=document.createElement('small');meta.textContent=[item.year,item.info|| (item.episodes?item.episodes+'集':'' )].filter(Boolean).join(' · ')||'豆瓣条目';txt.append(title,meta);b.append(img,txt);b.onclick=()=>{ $('fTitle').value=item.title;$('fPoster').value=item.poster;$('fDouban').value=item.url;if(item.episodes){$('fTotal').value=item.episodes;if(Number($('fWatched').value)>item.episodes)$('fWatched').value=item.episodes;if(Number($('fAired').value)>item.episodes)$('fAired').value=item.episodes;}box.innerHTML='<div class="muted">已匹配：'+esc(item.title)+(item.episodes?' · '+item.episodes+' 集':' · 未获取到总集数，可手动填写')+'</div>';};box.append(b)});}catch(e){box.innerHTML='<div class="muted">'+esc(e.message||'豆瓣搜索失败')+'。可能是第三方接口跨域或访问限制。你仍可手动填写集数，也可以稍后重试。</div>'}}
function saveDrama(){let title=$('fTitle').value.trim(),total=Math.max(1,Number($('fTotal').value)||1),w=Math.min(total,Math.max(0,Number($('fWatched').value)||0)),aired=Math.min(total,Math.max(0,Number($('fAired').value)||0));if(!title){alert('请填写电视剧名称');return}let id=$('editId').value;if(id){let d=data.dramas.find(x=>x.id===id);if(d){d.title=title;d.total=total;d.watched=w;d.aired=aired;d.status=$('fStatus').value;d.platform=$('fPlatform').value;d.region=$('fRegion').value;d.date=$('fDate').value;d.notes=$('fNotes').value;d.poster=$('fPoster').value;d.doubanUrl=$('fDouban').value}}else data.dramas.unshift({id:crypto.randomUUID(),title,total,watched:w,aired,status:$('fStatus').value,platform:$('fPlatform').value,region:$('fRegion').value,date:$('fDate').value,notes:$('fNotes').value,poster:$('fPoster').value,doubanUrl:$('fDouban').value});closeForm();save()}
function deleteDrama(id){if(!confirm('确定删除这部电视剧及其记录吗？'))return;data.dramas=data.dramas.filter(d=>d.id!==id);data.records=data.records.filter(r=>r.dramaId!==id);save()}
function renderDiary(){let date=$('diaryDate').value||todayKey(),rs=data.records.filter(r=>r.date===date);$('diaryTitle').textContent=date;$('diaryTotal').textContent='观看 '+rs.reduce((a,r)=>a+r.episodes,0)+' 集';$('records').innerHTML=rs.length?rs.map(r=>`<div class="record"><div><b>${esc(r.title)}</b><div class="muted">观看 ${r.episodes} 集</div></div><b style="color:var(--green)">+${r.episodes}</b></div>`).join(''):'<div class="card empty"><div class="emoji">📖</div>这一天还没有追剧记录</div>'}
function renderStats(){let now=new Date(),start=new Date(now);start.setDate(now.getDate()-((now.getDay()+6)%7));let sum=(arr)=>arr.reduce((a,r)=>a+r.episodes,0),today=data.records.filter(r=>r.date===todayKey()),week=data.records.filter(r=>new Date(r.date+'T00:00:00')>=start),all=data.dramas.reduce((a,d)=>a+d.watched,0),remain=data.dramas.reduce((a,d)=>a+(d.watched>=d.total?0:Math.max(0,d.total-d.watched)),0);$('sToday').textContent=sum(today);$('sWeek').textContent=sum(week);$('sAll').textContent=all;$('sRemain').textContent=remain;$('progressList').innerHTML=data.dramas.length?data.dramas.map(d=>`<div class="panel" style="margin:9px 0"><div class="row"><b>${esc(d.title)}</b><small class="muted">${d.watched}/${d.total}</small></div><div class="bar"><span style="width:${d.watched/d.total*100}%"></span></div></div>`).join(''):'<div class="card empty">添加电视剧后，这里会显示进度。</div>'}
function exportData(){let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='追剧日记备份.json';a.click();URL.revokeObjectURL(a.href)}
function importData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!Array.isArray(x.dramas)||!Array.isArray(x.records))throw 0;if(confirm('导入将覆盖当前片单和记录，确定继续吗？')){data=x;save();alert('导入成功')}}catch(err){alert('文件格式不正确，无法导入')}};r.readAsText(f);e.target.value=''}

Object.assign(window,{render,tab,openForm,editDrama,closeForm,searchEpisodeCount,applyEpisodeChoice,saveDrama,deleteDrama,reorderDrama,watched,renderDiary,renderStats,exportData,importData});

$('todayLabel').textContent=new Date().toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric',weekday:'long'});
$('diaryDate').value=todayKey();load();render();renderDiary();
